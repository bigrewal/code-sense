services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo_data:/data/db
  api:
    build: .
    env_file:
      - .env.local
    environment:
      MONGO_URI: mongodb://mongo:27017
      BASE_REPO_DIR: /app/data
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  mongo_data:
