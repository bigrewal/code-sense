[project]
name = "code-sense"
version = "0.1.0"
description = "Add your description here"
readme = { text = "CodeSense backend and local MCP server.", content-type = "text/markdown" }
requires-python = ">=3.11.0"
dependencies = [
    "fastapi>=0.116.1",
    "grpcio>=1.76.0",
    "loguru>=0.7.3",
    "mcp>=1.27.1",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "tqdm>=4.67.1",
    "uvicorn>=0.35.0",
    "xai-sdk>=1.4.0",
]

[project.scripts]
code-sense-mcp = "app.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
openai = [
    "openai>=1.40.0",
    "tiktoken>=0.7.0",
]
anthropic = [
    "anthropic>=0.40.0",
    "tiktoken>=0.7.0",
]
bedrock = [
    "anthropic[bedrock]>=0.40.0",
    "boto3>=1.35.0",
    "tiktoken>=0.7.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "freezegun>=1.2.2",
]
eval = [
    "datasets>=2.21.0",
]
